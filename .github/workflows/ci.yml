name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-self-hosted-ci:
    name: Windows Self-Hosted CI
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 45
    env:
      LLM_PROVIDER: mock
      OCR_PROVIDER: mock
      RAGFLOW_PROVIDER: mock
      GRAPH_PROVIDER: mock
      STORAGE_PROVIDER: local
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - name: Prepare git SSH trust
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.ssh" | Out-Null
          if (-not (Test-Path "$env:USERPROFILE\.ssh\known_hosts")) {
            New-Item -ItemType File -Path "$env:USERPROFILE\.ssh\known_hosts" | Out-Null
          }
          if (Get-Command ssh-keyscan -ErrorAction SilentlyContinue) {
            ssh-keyscan github.com | Out-File -Append "$env:USERPROFILE\.ssh\known_hosts"
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-strict: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
